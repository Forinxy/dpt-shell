name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Tencent Gradle distribution mirror: faster downloads when the official
      # distribution host is unreachable. Aliyun Maven mirrors (google/central/
      # public) are already baked into settings.gradle.
      - name: Use Tencent Gradle distribution mirror
        run: |
          sed -i 's#https\\://services.gradle.org/distributions#https\\://mirrors.cloud.tencent.com/gradle#g' gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon -PuseAliyunMirror=false

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dpt-shell-app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
