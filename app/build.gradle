plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.luoye.dpt.app'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.luoye.dpt.app"
        minSdkVersion 26
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.appVersionCode
        versionName rootProject.ext.appVersionName

        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
        }

        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java', '../dpt/src/main/java']
            java.exclude '**/Dpt.java'
            java.exclude '**/builder/Aab.java'
            java.exclude '**/res/AabManifestEditor.java'
            java.exclude '**/res/AndroidResourcesEditor.java'
            assets.srcDirs = ['src/main/assets']
        }
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA',
                         'META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/NOTICE']
        }
    }
}

dependencies {
    implementation fileTree(dir: '../dpt/libs', include: [
            'ManifestEditor-1.0.2.jar',
            'apksigner.jar',
            'zipalign-java-1.0.0.jar'
    ])

    implementation 'net.lingala.zip4j:zip4j:2.11.5'
    implementation 'org.apache.commons:commons-lang3:3.17.0'
    implementation 'org.apache.commons:commons-io:1.3.2'
    implementation 'com.linkedin.dexmaker:dexmaker:2.28.5'
    implementation 'com.jakewharton.android.repackaged:dalvik-dx:9.0.0_r3'
    implementation 'com.android.tools.smali:smali-dexlib2:3.0.9'
    implementation 'com.alibaba.fastjson2:fastjson2:2.0.60'
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.78.1'
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.78.1'

    def composeBom = platform('androidx.compose:compose-bom:2024.12.01')
    implementation composeBom
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'

    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
}
